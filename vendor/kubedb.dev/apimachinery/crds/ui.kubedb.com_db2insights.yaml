apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: db2insights.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: DB2Insight
    listKind: DB2InsightList
    plural: db2insights
    singular: db2insight
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              bufferPoolHitRatioPercent:
                format: double
                type: number
              connections:
                properties:
                  currentConnections:
                    format: int64
                    type: integer
                  totalConnections:
                    format: int64
                    type: integer
                type: object
              databaseName:
                type: string
              instanceName:
                type: string
              reachable:
                type: boolean
              replicas:
                properties:
                  desired:
                    format: int32
                    type: integer
                  ready:
                    format: int32
                    type: integer
                required:
                - ready
                type: object
              serviceLevel:
                type: string
              status:
                enum:
                - Provisioning
                - DataRestoring
                - Ready
                - Critical
                - NotReady
                - Halted
                - Unknown
                type: string
              totalSchemas:
                format: int32
                type: integer
              totalTables:
                format: int32
                type: integer
              totalTablespaces:
                format: int32
                type: integer
              version:
                type: string
            required:
            - status
            - version
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    severity:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Provisioning
                - DataRestoring
                - Ready
                - Critical
                - NotReady
                - Halted
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
