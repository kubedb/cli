apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: druidinsights.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: DruidInsight
    listKind: DruidInsightList
    plural: druidinsights
    singular: druidinsight
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              datasources:
                items:
                  properties:
                    availableSegments:
                      format: int64
                      type: integer
                    maxTime:
                      format: date-time
                      type: string
                    minTime:
                      format: date-time
                      type: string
                    name:
                      type: string
                    realtimeSegments:
                      format: int64
                      type: integer
                    segmentCount:
                      format: int64
                      type: integer
                    totalRows:
                      format: int64
                      type: integer
                    totalSizeBytes:
                      format: int64
                      type: integer
                    unavailableSegments:
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              services:
                items:
                  properties:
                    leaderAddress:
                      type: string
                    replicaCount:
                      format: int32
                      type: integer
                    type:
                      type: string
                    version:
                      type: string
                  required:
                  - replicaCount
                  - type
                  type: object
                type: array
              version:
                type: string
            required:
            - version
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    severity:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Provisioning
                - DataRestoring
                - Ready
                - Critical
                - NotReady
                - Halted
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
