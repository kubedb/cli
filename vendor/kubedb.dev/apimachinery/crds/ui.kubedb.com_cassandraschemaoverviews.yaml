apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: cassandraschemaoverviews.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: CassandraSchemaOverview
    listKind: CassandraSchemaOverviewList
    plural: cassandraschemaoverviews
    singular: cassandraschemaoverview
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              keyspaces:
                items:
                  properties:
                    durableWrites:
                      type: boolean
                    name:
                      type: string
                    replicationClass:
                      type: string
                    replicationFactors:
                      additionalProperties:
                        type: string
                      type: object
                    tables:
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
            required:
            - keyspaces
            type: object
        type: object
    served: true
    storage: true
