apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: milvusversions.catalog.kubedb.com
spec:
  group: catalog.kubedb.com
  names:
    categories:
    - catalog
    - kubedb
    - appscode
    kind: MilvusVersion
    listKind: MilvusVersionList
    plural: milvusversions
    shortNames:
    - mvversion
    singular: milvusversion
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.db.image
      name: DB_IMAGE
      type: string
    - jsonPath: .spec.deprecated
      name: Deprecated
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              archiver:
                properties:
                  addon:
                    properties:
                      name:
                        enum:
                        - mongodb-addon
                        - postgres-addon
                        - mysql-addon
                        - mariadb-addon
                        - mssqlserver-addon
                        - clickhouse-addon
                        - neo4j-addon
                        - documentdb-addon
                        - milvus-addon
                        type: string
                      tasks:
                        properties:
                          fullBackup:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          fullBackupRestore:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          incBackupRestore:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          manifestBackup:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          manifestRestore:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          volumeSnapshot:
                            properties:
                              name:
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                    type: object
                  walg:
                    properties:
                      image:
                        type: string
                    required:
                    - image
                    type: object
                type: object
              db:
                properties:
                  gpu:
                    properties:
                      computeCapabilities:
                        items:
                          type: string
                        type: array
                      supported:
                        type: boolean
                    required:
                    - supported
                    type: object
                  image:
                    type: string
                required:
                - image
                type: object
              deprecated:
                type: boolean
              endOfLife:
                type: boolean
              etcdVersion:
                type: string
              securityContext:
                properties:
                  runAsUser:
                    format: int64
                    type: integer
                type: object
              ui:
                items:
                  properties:
                    disable:
                      type: boolean
                    name:
                      type: string
                    values:
                      x-kubernetes-preserve-unknown-fields: true
                    version:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              updateConstraints:
                properties:
                  allowlist:
                    items:
                      type: string
                    type: array
                  denylist:
                    items:
                      type: string
                    type: array
                type: object
              version:
                type: string
            required:
            - db
            - etcdVersion
            - version
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
