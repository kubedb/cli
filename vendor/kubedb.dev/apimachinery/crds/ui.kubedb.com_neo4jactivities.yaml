apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: neo4jactivities.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: Neo4jActivity
    listKind: Neo4jActivityList
    plural: neo4jactivities
    singular: neo4jactivity
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              collectedAt:
                format: date-time
                type: string
              incomplete:
                type: boolean
              summary:
                properties:
                  blockedTransactions:
                    format: int32
                    type: integer
                  longRunningThresholdMillis:
                    format: int64
                    type: integer
                  longRunningTransactions:
                    format: int32
                    type: integer
                  runningQueries:
                    format: int32
                    type: integer
                  totalTransactions:
                    format: int32
                    type: integer
                  waitingQueries:
                    format: int32
                    type: integer
                type: object
              transactions:
                items:
                  properties:
                    activeLockCount:
                      format: int64
                      type: integer
                    clientAddress:
                      type: string
                    connectionID:
                      type: string
                    currentQueryID:
                      type: string
                    currentQueryStatus:
                      type: string
                    database:
                      type: string
                    elapsedTimeMillis:
                      format: int64
                      type: integer
                    query:
                      type: string
                    queryTruncated:
                      type: boolean
                    serverName:
                      type: string
                    startTime:
                      format: date-time
                      type: string
                    status:
                      type: string
                    transactionID:
                      type: string
                    username:
                      type: string
                    waitTimeMillis:
                      format: int64
                      type: integer
                  required:
                  - database
                  - serverName
                  type: object
                type: array
              transactionsTruncated:
                type: boolean
              unavailableServers:
                items:
                  type: string
                type: array
            required:
            - summary
            type: object
        type: object
    served: true
    storage: true
