apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: druidtasks.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: DruidTasks
    listKind: DruidTasksList
    plural: druidtasks
    singular: druidtasks
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              collectedAt:
                format: date-time
                type: string
              summary:
                properties:
                  failedTasks:
                    format: int64
                    type: integer
                  pendingTasks:
                    format: int64
                    type: integer
                  runningTasks:
                    format: int64
                    type: integer
                  successfulTasks:
                    format: int64
                    type: integer
                  totalTasks:
                    format: int64
                    type: integer
                  waitingTasks:
                    format: int64
                    type: integer
                type: object
              tasks:
                items:
                  properties:
                    createdAt:
                      format: date-time
                      type: string
                    datasource:
                      type: string
                    durationMillis:
                      format: int64
                      type: integer
                    errorMessage:
                      type: string
                    errorMessageTruncated:
                      type: boolean
                    groupID:
                      type: string
                    host:
                      type: string
                    id:
                      type: string
                    location:
                      type: string
                    plaintextPort:
                      format: int32
                      type: integer
                    queueInsertionTime:
                      format: date-time
                      type: string
                    runnerStatus:
                      type: string
                    status:
                      type: string
                    tlsPort:
                      format: int32
                      type: integer
                    type:
                      type: string
                  required:
                  - id
                  type: object
                type: array
              tasksTruncated:
                type: boolean
            required:
            - summary
            type: object
        type: object
    served: true
    storage: true
