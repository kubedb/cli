apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: milvusschemaoverviews.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: MilvusSchemaOverview
    listKind: MilvusSchemaOverviewList
    plural: milvusschemaoverviews
    singular: milvusschemaoverview
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              collections:
                items:
                  properties:
                    consistencyLevel:
                      type: string
                    databaseName:
                      type: string
                    indexes:
                      items:
                        type: string
                      type: array
                    loadProgress:
                      format: int64
                      type: integer
                    loaded:
                      type: boolean
                    name:
                      type: string
                    partitions:
                      items:
                        type: string
                      type: array
                    rowCount:
                      format: int64
                      type: integer
                    shardNum:
                      format: int32
                      type: integer
                    storageSizeBytes:
                      format: int64
                      type: integer
                  required:
                  - databaseName
                  - loaded
                  - name
                  type: object
                type: array
            required:
            - collections
            type: object
        type: object
    served: true
    storage: true
