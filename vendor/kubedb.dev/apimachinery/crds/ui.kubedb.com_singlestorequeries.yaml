apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: singlestorequeries.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: SinglestoreQueries
    listKind: SinglestoreQueriesList
    plural: singlestorequeries
    singular: singlestorequeries
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              queries:
                items:
                  properties:
                    averageExecutionTimeMilliSeconds:
                      format: double
                      type: number
                    averageMemoryUseBytes:
                      format: int64
                      type: integer
                    commits:
                      format: int64
                      type: integer
                    cpuTimeMilliSeconds:
                      format: double
                      type: number
                    databaseName:
                      type: string
                    executionTimeMilliSeconds:
                      format: double
                      type: number
                    lastExecuted:
                      format: date-time
                      type: string
                    planId:
                      format: int64
                      type: integer
                    planType:
                      type: string
                    queryText:
                      type: string
                    rollbacks:
                      format: int64
                      type: integer
                    rowCount:
                      format: int64
                      type: integer
                  type: object
                type: array
            required:
            - queries
            type: object
        type: object
    served: true
    storage: true
