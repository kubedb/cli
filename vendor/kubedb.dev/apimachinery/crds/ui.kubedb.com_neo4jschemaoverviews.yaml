apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: neo4jschemaoverviews.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: Neo4jSchemaOverview
    listKind: Neo4jSchemaOverviewList
    plural: neo4jschemaoverviews
    singular: neo4jschemaoverview
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              collectedAt:
                format: date-time
                type: string
              databases:
                items:
                  properties:
                    constraints:
                      items:
                        properties:
                          entityType:
                            type: string
                          labelsOrTypes:
                            items:
                              type: string
                            type: array
                          name:
                            type: string
                          properties:
                            items:
                              type: string
                            type: array
                          propertyType:
                            type: string
                          type:
                            type: string
                        required:
                        - entityType
                        - name
                        - type
                        type: object
                      type: array
                    indexes:
                      items:
                        properties:
                          entityType:
                            type: string
                          labelsOrTypes:
                            items:
                              type: string
                            type: array
                          name:
                            type: string
                          populationPercent:
                            format: double
                            type: number
                          properties:
                            items:
                              type: string
                            type: array
                          state:
                            type: string
                          type:
                            type: string
                        required:
                        - entityType
                        - name
                        - state
                        - type
                        type: object
                      type: array
                    labels:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                    relationshipTypes:
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
            required:
            - databases
            type: object
        type: object
    served: true
    storage: true
