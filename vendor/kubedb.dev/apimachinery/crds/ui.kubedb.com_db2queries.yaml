apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/name: kubedb
  name: db2queries.ui.kubedb.com
spec:
  group: ui.kubedb.com
  names:
    kind: DB2Queries
    listKind: DB2QueriesList
    plural: db2queries
    singular: db2queries
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              queries:
                items:
                  properties:
                    avgExecutionTimeMilliSeconds:
                      format: int64
                      type: integer
                    numExecutions:
                      format: int64
                      type: integer
                    rowsRead:
                      format: int64
                      type: integer
                    rowsReturned:
                      format: int64
                      type: integer
                    statementText:
                      type: string
                    totalActTimeMilliSeconds:
                      format: int64
                      type: integer
                    totalCPUTimeMicroSeconds:
                      format: int64
                      type: integer
                  required:
                  - statementText
                  type: object
                type: array
            required:
            - queries
            type: object
        type: object
    served: true
    storage: true
